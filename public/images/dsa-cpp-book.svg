<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Overlay Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Node Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)" />
  <rect width="600" height="450" fill="url(#grid)" />

  <!-- Abstract Tree / Graph Diagram representing Data Structures -->
  <g opacity="0.4" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="4 4">
    <!-- Edges -->
    <line x1="430" y1="130" x2="380" y2="210" />
    <line x1="430" y1="130" x2="480" y2="210" />
    <line x1="380" y1="210" x2="340" y2="290" />
    <line x1="380" y1="210" x2="410" y2="290" />
    <line x1="480" y1="210" x2="460" y2="290" />
    <line x1="480" y1="210" x2="520" y2="290" />
    <line x1="410" y1="290" x2="480" y2="210" stroke="#c084fc" />
  </g>

  <!-- Graph Nodes -->
  <g>
    <!-- Root Node -->
    <circle cx="430" cy="130" r="16" fill="#6366f1" filter="url(#glow)" />
    <circle cx="430" cy="130" r="12" fill="#818cf8" />
    <text x="430" y="135" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">root</text>

    <!-- Level 1 -->
    <circle cx="380" cy="210" r="14" fill="#4f46e5" />
    <text x="380" y="214" fill="#c7d2fe" font-family="monospace" font-size="10" text-anchor="middle">L</text>

    <circle cx="480" cy="210" r="14" fill="#7c3aed" />
    <text x="480" y="214" fill="#e9d5ff" font-family="monospace" font-size="10" text-anchor="middle">R</text>

    <!-- Level 2 -->
    <circle cx="340" cy="290" r="11" fill="#3730a3" />
    <circle cx="410" cy="290" r="11" fill="#4338ca" />
    <circle cx="460" cy="290" r="11" fill="#6d28d9" />
    <circle cx="520" cy="290" r="11" fill="#5b21b6" />
  </g>

  <!-- Left Side: Book Cover Text Elements -->
  <rect x="40" y="45" width="230" height="26" rx="6" fill="rgba(147, 51, 234, 0.25)" stroke="#a855f7" stroke-width="1"/>
  <text x="52" y="62" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">
    COMPUTER SCIENCE SERIES
  </text>

  <!-- Big Title -->
  <text x="40" y="125" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="-0.5">
    DATA STRUCTURES
  </text>
  <text x="40" y="165" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
    &amp; ALGORITHMS
  </text>

  <!-- In C++ badge -->
  <g transform="translate(40, 190)">
    <rect width="130" height="38" rx="8" fill="url(#accentGrad)" />
    <text x="65" y="25" fill="#ffffff" font-family="monospace" font-size="17" font-weight="900" text-anchor="middle" letter-spacing="1">
      IN C++
    </text>
  </g>

  <!-- Subtitle and Meta -->
  <text x="40" y="260" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">
    Templates · STL · Complexity O(n) · Graphs &amp; Trees
  </text>

  <!-- Decorative separator -->
  <line x1="40" y1="285" x2="300" y2="285" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Code Snippet Box -->
  <g transform="translate(40, 310)">
    <rect width="280" height="95" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
    <text x="14" y="24" fill="#a78bfa" font-family="monospace" font-size="11">template &lt;typename T&gt;</text>
    <text x="14" y="42" fill="#38bdf8" font-family="monospace" font-size="11">class <tspan fill="#ffffff">BinarySearchTree</tspan> {</text>
    <text x="24" y="60" fill="#94a3b8" font-family="monospace" font-size="11">  Node&lt;T&gt;* root;</text>
    <text x="14" y="78" fill="#38bdf8" font-family="monospace" font-size="11">};</text>
  </g>

  <!-- Bottom Right Edition / Publisher -->
  <text x="560" y="420" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="end">
    ACADEMIC PRESS · SECOND EDITION
  </text>
</svg>
